<!-- Student view for the Coding Exam XBlock.
     Template markers [[KEY]] are replaced server-side by block.py.
     Hidden test cases are never rendered in this template or embedded JSON. -->
<div class="coding-exam-xblock">

  <!-- ── Problem Header: Title, Points, and Problem Statement ── -->
  <div class="ce-problem-card">
    <div class="ce-problem-header">
      <h3 class="ce-problem-title">[[DISPLAY_NAME]]</h3>
      <span class="ce-points-badge">[[POINTS]] points</span>
    </div>

    <div class="ce-problem-statement ce-statement-[[HAS_STATEMENT]]">
      [[PROBLEM_STATEMENT]]
    </div>

    <!-- Visible Sample Test Cases (Read-only reference) -->
    [[SAMPLE_TESTS]]
  </div>

  <!-- ── Toolbar: language selector + save indicator ── -->
  <div class="ce-toolbar">
    <label class="ce-lang-label" for="ce-lang-select">Language</label>
    <select id="ce-lang-select" class="ce-lang-select"></select>
    <span class="ce-save-status"></span>
  </div>

  <!-- ── CodeMirror 6 mounts into this div ── -->
  <div class="ce-editor-container"></div>

  <!-- ── Action bar ── -->
  <div class="ce-actions">
    <button class="ce-run-btn">&#9654; Run</button>
    <span class="ce-run-msg"></span>
  </div>

  <!-- ── Output panel (shown after Run) ── -->
  <div class="ce-output-panel">
    <div class="ce-output-header">Output</div>
    <pre class="ce-output"></pre>
  </div>

  <!-- ── Initial state: JSON read by CodingExamXBlock() JS function ── -->
  <script type="application/json" class="ce-init-data">[[INIT_DATA]]</script>

</div>
